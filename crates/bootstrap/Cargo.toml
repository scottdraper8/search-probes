[package]
name = "search-probes-bootstrap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "winmm"
crate-type = ["cdylib"]

[target.'cfg(windows)'.dependencies]
search-probes-native = { path = "../native" }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_SystemInformation"] }
