[package]
name = "search-probes-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[features]
investigation = []
gpu-qualification = []

[dependencies]
bcdec_rs = "=0.2.0"
iced-x86 = { version = "1.21.0", default-features = false, features = ["std", "decoder", "block_encoder", "instr_info"] }
search-probes-model = { path = "../model" }
search-probes-ui = { path = "../ui" }
serde_json = "1.0"
sha2 = "0.11"
zstd = { version = "=0.13.3", default-features = false }

[target."cfg(windows)".dependencies]
ash = { version = "=0.38.0", default-features = false, features = ["std", "debug"] }
egui-ash-renderer = "=0.13.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_Diagnostics_Debug", "Win32_System_LibraryLoader", "Win32_System_Kernel", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_UI_HiDpi"] }

[build-dependencies]
naga = { version = "=30.0.1", default-features = false, features = ["wgsl-in", "spv-out"] }

[dev-dependencies]
ash = { version = "=0.38.0", default-features = false, features = ["std", "debug", "loaded"] }
half = "=2.7.1"
