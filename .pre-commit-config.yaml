default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: local
    hooks:
      - id: contribution-branch-policy
        name: reject attributed branch names
        entry: .github/scripts/check_contribution_attribution.py branches
        language: python
        pass_filenames: false
        always_run: true
      - id: contribution-message-policy
        name: reject attributed commit metadata
        entry: .github/scripts/check_contribution_attribution.py message-file
        language: python
        stages: [commit-msg]
