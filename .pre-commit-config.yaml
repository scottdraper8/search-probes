minimum_pre_commit_version: "4.6.2"
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=5120]
      - id: trailing-whitespace
        # Imported license texts remain byte-for-byte identical to their sources.
        exclude: &verbatim_license_texts >-
          ^(licenses/|crates/ui/assets/fonts/nms-geosans/OFL-1\.1\.txt$|crates/ui/assets/glyphs/nms-portal/LICENSE\.txt$)
      - id: end-of-file-fixer
        exclude: *verbatim_license_texts
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: *verbatim_license_texts
      - id: check-yaml
        files: ^\.github/(dependabot\.ya?ml|workflows/.*\.ya?ml)$
        types: [file]
      - id: check-toml
      - id: check-json
      - id: check-ast
        files: \.py$
      - id: debug-statements
        files: \.py$
      - id: check-xml
        files: (?i)\.(exml|mxml|xml)$
        types: [file]
      - id: detect-private-key

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/bnjbvr/cargo-machete
    rev: ac30a525c0a8d163a92d727b3ff079ee3f6ecb08 # v0.9.2
    hooks:
      - id: cargo-machete
        pass_filenames: false
        files: (^|/)Cargo\.toml$|\.rs$

  - repo: https://github.com/gitleaks/gitleaks
    rev: 2ca41cc1372d1e939a6a879f18cdc19fc1cac1ce # v8.30.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: dependency-policy
        name: validate pinned Rust dependency and toolchain policy
        entry: .github/scripts/check_dependency_policy.py
        language: python
        pass_filenames: false
        always_run: true
        files: (^|/)Cargo\.toml$|^Cargo\.lock$|^rust-toolchain\.toml$

      - id: rustfmt
        name: rustfmt workspace
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false
        files: \.rs$

      - id: clippy-host
        name: Clippy host workspace
        entry: env CARGO_BUILD_WARNINGS=deny cargo clippy --workspace --all-targets --all-features --locked
        language: system
        pass_filenames: false
        files: (^|/)Cargo\.toml$|^Cargo\.lock$|^rust-toolchain\.toml$|^crates/.*\.rs$

      - id: clippy-windows
        name: Clippy Windows release target
        entry: .github/scripts/check_windows_target.py
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: ^(Cargo\.lock|Cargo\.toml|rust-toolchain\.toml|crates/|tooling/windows\.Containerfile$|\.github/scripts/check_windows_target\.py$)
