name: Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-gate:
    name: dependency-audit
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Detect security-relevant changes
        id: changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only HEAD^1 HEAD | grep -Eq '(^|/)Cargo\.toml$|^Cargo\.lock$|^rust-toolchain\.toml$|^\.github/dependabot\.yml$|^\.github/workflows/'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enforce exact direct dependency pins
        if: steps.changes.outputs.relevant == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          import tomllib

          manifests = [
              path
              for path in subprocess.check_output(["git", "ls-files"], text=True).splitlines()
              if path.endswith("Cargo.toml")
          ]
          invalid = []
          sections = ("dependencies", "dev-dependencies", "build-dependencies")

          def inspect(manifest, section, dependencies):
              for name, specification in dependencies.items():
                  version = specification if isinstance(specification, str) else specification.get("version")
                  if version is not None and not version.startswith("="):
                      invalid.append(f"{manifest}: {section}.{name} uses {version!r}")

          for manifest in manifests:
              with open(manifest, "rb") as stream:
                  document = tomllib.load(stream)
              for section in sections:
                  inspect(manifest, section, document.get(section, {}))
                  inspect(manifest, f"workspace.{section}", document.get("workspace", {}).get(section, {}))
              for target, configuration in document.get("target", {}).items():
                  for section in sections:
                      inspect(manifest, f"target.{target}.{section}", configuration.get(section, {}))

          if invalid:
              raise SystemExit("Direct dependencies must use exact versions:\n" + "\n".join(invalid))
          PY

      - name: Audit dependencies
        if: steps.changes.outputs.relevant == 'true'
        shell: bash
        env:
          CARGO_AUDIT_VERSION: 0.22.2
          CARGO_AUDIT_SHA256: ab28a1bdb54db4d5d8ad5981cf1f959410370b3d28250dbd35f6a44248620e39
        run: |
          archive="cargo-audit-x86_64-unknown-linux-gnu-v${CARGO_AUDIT_VERSION}.tgz"
          directory="cargo-audit-x86_64-unknown-linux-gnu-v${CARGO_AUDIT_VERSION}"
          path="$RUNNER_TEMP/$archive"

          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$path" \
            "https://github.com/rustsec/rustsec/releases/download/cargo-audit/v${CARGO_AUDIT_VERSION}/$archive"
          printf '%s  %s\n' "$CARGO_AUDIT_SHA256" "$path" | sha256sum --check
          tar -xzf "$path" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/$directory/cargo-audit" audit --file Cargo.lock
