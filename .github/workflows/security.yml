name: Security

on:
  pull_request:
    paths:
      - ".github/dependabot.yml"
      - ".github/workflows/security.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**/Cargo.toml"
      - "rust-toolchain.toml"
  schedule:
    - cron: "23 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-gate:
    name: dependency-audit
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Audit dependencies
        shell: bash
        env:
          CARGO_AUDIT_VERSION: 0.22.2
          CARGO_AUDIT_SHA256: ab28a1bdb54db4d5d8ad5981cf1f959410370b3d28250dbd35f6a44248620e39
        run: |
          archive="cargo-audit-x86_64-unknown-linux-gnu-v${CARGO_AUDIT_VERSION}.tgz"
          directory="cargo-audit-x86_64-unknown-linux-gnu-v${CARGO_AUDIT_VERSION}"
          path="$RUNNER_TEMP/$archive"

          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$path" \
            "https://github.com/rustsec/rustsec/releases/download/cargo-audit/v${CARGO_AUDIT_VERSION}/$archive"
          printf '%s  %s\n' "$CARGO_AUDIT_SHA256" "$path" | sha256sum --check
          tar -xzf "$path" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/$directory/cargo-audit" audit --file Cargo.lock
